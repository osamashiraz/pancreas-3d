name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/**', 'viewer/test/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  smoke:
    # Load the built viewer in headless Chromium (software WebGL) and walk every stage before it is published.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Smoke test
        env:
          SMOKE_WAIT: '15000'
        run: python viewer/test/smoke.py dist/pancreas-organ-to-cell.html
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: viewer/test/out/

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/pancreas-organ-to-cell.html _site/index.html
          cp dist/pancreas-organ-to-cell.html _site/pancreas-organ-to-cell.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
